name: CP12 controlled NPU chain

"on":
  pull_request:
    branches: [codex/cp12-k3s-20261102]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cp12-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    if: github.repository == 'camusmil/tokenspeed'
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.selection.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CPU selection and adapter regressions
        run: |
          python3 -B -m unittest discover -s test/ci_system/npu -p test_changes.py
          python3 -B -m unittest discover -s test/ci_system/npu/k3s -p 'test_*.py'
      - name: Select the complete registered chain
        id: selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B test/ci_system/npu/changes.py --repo-root "$GITHUB_WORKSPACE" \
            --manifest test/ci/npu/manifest.json --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

  chain:
    name: Native chain / ${{ matrix.scenario }}
    needs: select
    if: needs.select.outputs.should_run == 'true' && github.event.pull_request.draft == false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [normal, operator-failure, model-failure, save-failure]
    runs-on: tokenspeed-pr-arm64
    timeout-minutes: 125
    steps:
      - name: Execute registered stages and verify durable evidence
        run: node /opt/cp11/cp12-client.js '${{ matrix.scenario }}'
      - name: Upload required evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp12-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: cp12-results/
          if-no-files-found: error
          retention-days: 14
