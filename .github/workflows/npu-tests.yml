name: NPU Operator Tests

"on":
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: 检查算子相关变更
    if: ${{ github.repository == 'camusmil/tokenspeed' && github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - name: 获取本次提交与历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 判断是否运行算子测试
        id: changes
        shell: bash
        run: |
          python3 -B test/ci_system/npu_operator_changes.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest ci/npu_ops/manifest.json \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/npu-change-selection.json"

  npu:
    name: NPU 算子测试
    needs: select
    if: ${{ needs.select.outputs.should_run == 'true' }}
    runs-on: tokenspeed-fork-npu-setup
    timeout-minutes: 60
    steps:
      - name: 全部算子精度测试
        id: accuracy
        shell: bash
        env:
          NPU_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -e -o pipefail
          test "$(id -un)" = ci-npu
          test "$RUNNER_NAME" = tokenspeed-fork-npu-01
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$GITHUB_SERVER_URL" = https://github.com
          test "$GITHUB_REPOSITORY" = camusmil/tokenspeed
          work=$(mktemp -d "/srv/npu-ci/jobs/slot0/actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX")
          echo "本次运行目录：$work"
          printf 'NPU_CI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          git init -q "$work/checkout"
          GIT_TERMINAL_PROMPT=0 git -C "$work/checkout" \
            -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$NPU_CHECKOUT_TOKEN"; fi; }; f' \
            fetch --no-tags --depth=1 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          unset NPU_CHECKOUT_TOKEN
          git -C "$work/checkout" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
          test "$(git -C "$work/checkout" rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'repository=%s\nsha=%s\nrun_id=%s\nattempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$work/source.txt"
          test -f /srv/npu-ci/locks/host-all.lock
          exec 9<> /srv/npu-ci/locks/host-all.lock
          flock -n 9 || { echo "主机锁被占用，未启动精度测试"; exit 1; }
          source /srv/tokenspeed-npu/cann9-torch29-py312-root/env.sh
          export TMPDIR="$work/tmp"
          export XDG_CACHE_HOME="$work/cache"
          export TRITON_CACHE_DIR="$work/cache/triton"
          export PYTHONPYCACHEPREFIX="$work/cache/pycache"
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$TRITON_CACHE_DIR" "$PYTHONPYCACHEPREFIX"
          cd "$work/checkout"
          exec /srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python -B -u \
            ci/npu_ops/run_phase.py \
            --repo-root "$PWD" \
            --phase accuracy \
            --output-dir "$work/accuracy" \
            --timeout-seconds 600
      - name: 全部算子性能测试
        id: performance
        if: ${{ success() }}
        shell: bash
        run: |
          set -e -o pipefail
          test "$(id -un)" = ci-npu
          test -n "${NPU_CI_WORK:-}"
          work="$NPU_CI_WORK"
          cd "$work/checkout"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          echo "复用本次运行目录：$work"
          test -f /srv/npu-ci/locks/host-all.lock
          exec 9<> /srv/npu-ci/locks/host-all.lock
          flock -n 9 || { echo "主机锁被占用，未启动性能测试"; exit 1; }
          source /srv/tokenspeed-npu/cann9-torch29-py312-root/env.sh
          export TMPDIR="$work/tmp"
          export XDG_CACHE_HOME="$work/cache"
          export TRITON_CACHE_DIR="$work/cache/triton"
          export PYTHONPYCACHEPREFIX="$work/cache/pycache"
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" "$TRITON_CACHE_DIR" "$PYTHONPYCACHEPREFIX"
          cd "$work/checkout"
          exec /srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python -B -u \
            ci/npu_ops/run_phase.py \
            --repo-root "$PWD" \
            --phase performance \
            --output-dir "$work/performance" \
            --timeout-seconds 600
