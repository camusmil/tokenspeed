name: Ascend NPU K3s Acceptance

"on":
  pull_request:
    branches: [main, codex/cp12-k3s-20261102]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npu-k3s-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    if: >-
      github.repository == 'camusmil/tokenspeed' &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'npu-ci-acceptance') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CPU adapter regressions
        run: python3 -B -m unittest discover -s test/ci_system/npu/k3s -p 'test_*.py'

  acceptance:
    needs: scan
    name: Acceptance / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [normal, operator-failure, model-failure, save-failure]
    permissions:
      contents: read
      id-token: write
    runs-on: tokenspeed-pr-arm64
    timeout-minutes: 125
    steps:
      - name: Validate registered chain and expected failure behavior
        env:
          NPU_SCENARIO: ${{ matrix.scenario }}
        run: node /opt/cp11/cp12-client.js "$NPU_SCENARIO"
      - name: Upload required evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npu-k3s-acceptance-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: cp12-results/
          if-no-files-found: error
          retention-days: 14
