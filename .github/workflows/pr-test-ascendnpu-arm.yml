name: PR Test Ascend NPU ARM

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_model_validation:
        description: Run model validation before automatic model CI is enabled
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-test-npu-arm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    name: Check Ascend NPU ARM changes
    if: |
      (github.repository == 'lightseekorg/tokenspeed' ||
       github.repository == vars.TOKENSPEED_NPU_CI_REPOSITORY) &&
      github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      reason: ${{ steps.changes.outputs.reason }}
      matrix: ${{ steps.changes.outputs.matrix }}
      timeout_minutes: ${{ steps.changes.outputs.timeout_minutes }}
      model_should_run: ${{ steps.changes.outputs.model_should_run }}
      model_matrix: ${{ steps.changes.outputs.model_matrix }}
      model_timeout_minutes: ${{ steps.changes.outputs.model_timeout_minutes }}
      model_allowed: ${{ steps.changes.outputs.model_allowed }}
      checkout_ref: ${{ github.sha }}
    steps:
      - name: Check out event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select operator and model tasks
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPU_ARM_CI_ENABLED: ${{ vars.TOKENSPEED_NPU_ARM_CI_ENABLED }}
          NPU_MODEL_CI_ENABLED: ${{ vars.TOKENSPEED_NPU_ARM_MODEL_CI_ENABLED }}
          NPU_MODEL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_model_validation == true }}
          NPU_ARM_RUNNER_NAME: ${{ vars.TOKENSPEED_NPU_ARM_RUNNER_NAME }}
          NPU_PR_IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 -B test/ci_system/npu/ci_path_filter.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --task test/ci/ut/npu-operators.yaml \
            --task test/ci/ut/ut-runtime-qwen-smoke-1npu.yaml \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/npu-change-selection.json"
          python3 -B - "$RUNNER_TEMP/npu-change-selection.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          selection = json.loads(Path(sys.argv[1]).read_text())
          enabled = os.environ["NPU_ARM_CI_ENABLED"].lower() == "true"
          draft = os.environ["NPU_PR_IS_DRAFT"] == "true"
          runner_name_configured = bool(os.environ["NPU_ARM_RUNNER_NAME"].strip())
          model_allowed = os.environ["NPU_MODEL_CI_ENABLED"].lower() == "true" or os.environ["NPU_MODEL_VALIDATION"] == "true"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"model_allowed={str(model_allowed).lower()}\n")
          decisions = {}
          for stage, selected in selection["stages"].items():
              reasons = []
              if not selected["should_run"]:
                  reasons.append(selected["reason"])
              if not enabled:
                  reasons.append("hardware-disabled")
              if draft:
                  reasons.append("draft-pr")
              if stage == "model" and not model_allowed:
                  reasons.append("model-disabled")
              action = "skip" if reasons else "request-runner"
              if action == "request-runner" and not runner_name_configured:
                  action = "fail"
                  reasons.append("missing-runner-name")
              decisions[stage] = {
                  "hardware_action": action, "reasons": reasons,
                  "selection_reason": selected["reason"], "should_run": selected["should_run"],
                  "hardware_enabled": enabled, "draft_pr": draft,
                  "required_runner_label": "ascend-npu-ops-test", "runner_name_configured": runner_name_configured,
              }
          print(json.dumps(decisions, indent=2), flush=True)
          summary = ["### Ascend NPU ARM scheduling decision", "", "| Stage | Decision | Reasons |", "| --- | --- | --- |"]
          summary.extend(f"| {stage} | `{decision['hardware_action']}` | `{json.dumps(decision['reasons'])}` |" for stage, decision in decisions.items())
          summary.extend(["", "Requesting a runner does not mean tests have run. Both selected tasks run in operator-then-model order; operator failure or cancellation blocks the model.", ""])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n".join(summary))
          if any(decision["hardware_action"] == "fail" for decision in decisions.values()):
              raise SystemExit("Repository variable TOKENSPEED_NPU_ARM_RUNNER_NAME must be configured")
          PY

  operator-tests:
    needs: scan
    if: |
      vars.TOKENSPEED_NPU_ARM_CI_ENABLED == 'true' &&
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.matrix != '{"include": []}' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      install_tokenspeed_mla_from_source: "${{ 'false' }}"
      matrix: ${{ needs.scan.outputs.matrix }}
      checkout_ref: ${{ needs.scan.outputs.checkout_ref }}
      timeout_minutes: ${{ fromJSON(needs.scan.outputs.timeout_minutes) }}

  model-smoke:
    needs: [scan, operator-tests]
    if: |
      always() && !cancelled() &&
      needs.scan.result == 'success' &&
      (needs.operator-tests.result == 'success' ||
       (needs.operator-tests.result == 'skipped' && needs.scan.outputs.should_run == 'false')) &&
      vars.TOKENSPEED_NPU_ARM_CI_ENABLED == 'true' &&
      needs.scan.outputs.model_should_run == 'true' &&
      needs.scan.outputs.model_allowed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      install_tokenspeed_mla_from_source: "${{ 'false' }}"
      matrix: ${{ needs.scan.outputs.model_matrix }}
      checkout_ref: ${{ needs.scan.outputs.checkout_ref }}
      timeout_minutes: ${{ fromJSON(needs.scan.outputs.model_timeout_minutes) }}
