name: Ascend NPU Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npu-k3s-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    if: >-
      (github.repository == 'lightseekorg/tokenspeed' ||
       github.repository == vars.TOKENSPEED_NPU_CI_REPOSITORY) &&
      github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.selection.outputs.should_run }}
      hardware_enabled: ${{ vars.TOKENSPEED_NPU_K3S_CI_ENABLED == 'true' }}
      unit_matrix: ${{ steps.tasks.outputs.unit_matrix }}
      unit_has_tasks: ${{ steps.tasks.outputs.unit_has_tasks }}
      model_matrix: ${{ steps.tasks.outputs.model_matrix }}
      model_has_tasks: ${{ steps.tasks.outputs.model_has_tasks }}
    steps:
      - name: Check out event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CPU selection and adapter regressions
        run: |
          python3 -B -m unittest discover -s test/ci_system/npu -p test_changes.py
          python3 -B -m unittest discover -s test/ci_system/npu/k3s -p 'test_*.py'
      - name: Classify changed paths
        id: selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B test/ci_system/npu/changes.py --repo-root "$GITHUB_WORKSPACE" \
            --manifest test/ci/npu/manifest.json --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build task matrices
        id: tasks
        env:
          NPU_SELECTED: ${{ steps.selection.outputs.should_run }}
          NPU_RUNNER_LABEL: ${{ vars.TOKENSPEED_NPU_K3S_RUNNER_LABEL || 'tokenspeed-pr-arm64' }}
        run: |
          python3 -B test/ci_system/npu/k3s/task_contract.py \
            --selected "$NPU_SELECTED" --runner-label "$NPU_RUNNER_LABEL" \
            --github-output "$GITHUB_OUTPUT"

  unit-test:
    needs: scan
    if: >-
      needs.scan.outputs.hardware_enabled == 'true' &&
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.unit_has_tasks == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/run-npu-k3s-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.unit_matrix }}
      prerequisite_task_id: ''
      prerequisite_receipt_sha256: ''

  model-test:
    needs: [scan, unit-test]
    if: >-
      !cancelled() && needs.scan.result == 'success' &&
      needs.scan.outputs.hardware_enabled == 'true' &&
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.model_has_tasks == 'true' &&
      needs.unit-test.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/run-npu-k3s-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.model_matrix }}
      prerequisite_task_id: ${{ needs.unit-test.outputs.task_id }}
      prerequisite_receipt_sha256: ${{ needs.unit-test.outputs.result_sha256 }}

  finish:
    if: >-
      always() &&
      (github.repository == 'lightseekorg/tokenspeed' ||
       github.repository == vars.TOKENSPEED_NPU_CI_REPOSITORY) &&
      github.event.deleted != true
    needs: [scan, unit-test, model-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Finish
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          NPU_SELECTED: ${{ needs.scan.outputs.should_run }}
          HARDWARE_ENABLED: ${{ needs.scan.outputs.hardware_enabled }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          MODEL_TEST_RESULT: ${{ needs.model-test.result }}
        run: |
          set -euo pipefail
          test "$SCAN_RESULT" = success
          if [[ "$NPU_SELECTED" != true || "$IS_DRAFT" = true || "$HARDWARE_ENABLED" != true ]]; then
            test "$UNIT_TEST_RESULT" = skipped
            test "$MODEL_TEST_RESULT" = skipped
            echo "NPU hardware skipped: selected=$NPU_SELECTED draft=$IS_DRAFT enabled=$HARDWARE_ENABLED" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            test "$UNIT_TEST_RESULT" = success
            test "$MODEL_TEST_RESULT" = success
            echo 'NPU operator and model tasks completed successfully.'
          fi
