name: Run NPU CI Task Matrix
'on':
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      checkout_ref:
        type: string
        required: true
      timeout_minutes:
        type: number
        required: true
permissions:
  contents: read
jobs:
  task:
    name: ${{ matrix.name }} (${{ matrix.runner }})
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      TOKENSPEED_NPU_CI_REPOSITORY: ${{ vars.TOKENSPEED_NPU_CI_REPOSITORY }}
      TOKENSPEED_NPU_ARM_RUNNER_NAME: ${{ vars.TOKENSPEED_NPU_ARM_RUNNER_NAME }}
      NPU_CI_RUNTIME: /srv/npu-ci/runtime/vm-phase1-qwen-v1
      NPU_CHECKOUT_REF: ${{ inputs.checkout_ref }}
      NPU_TASK_TYPE: ${{ matrix.type }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Prepare exact task source
      id: prepare
      shell: bash
      env:
        NPU_TASK_CONFIG: ${{ matrix.config }}
        NPU_TASK_NAME: ${{ matrix.name }}
        NPU_TASK_RUNNER: ${{ matrix.runner }}
        NPU_JOB_MINUTES: ${{ inputs.timeout_minutes }}
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        "$python" -B "$helper" prepare --policy "$policy" --config "$NPU_TASK_CONFIG" --name "$NPU_TASK_NAME" --runner "$NPU_TASK_RUNNER" --type "$NPU_TASK_TYPE" --timeout-minutes "$NPU_JOB_MINUTES"
    - name: Run operator accuracy
      if: ${{ matrix.type == 'ut' }}
      id: accuracy
      shell: bash
      env:
        NPU_PHASE: accuracy
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        finish() {
          rc=$?
          trap - EXIT
          "$python" -B "$helper" lifecycle --policy "$policy" phase --work "$NPU_CI_WORK" --phase "$NPU_PHASE" --stage run-phase --exit "$rc" || rc=1
          exit "$rc"
        }
        trap finish EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        "$python" -B "$NPU_CI_WORK/checkout/test/ci_system/npu/pipeline.py" run --work "$NPU_CI_WORK" --mode "$NPU_PHASE"
    - name: Run operator performance
      if: ${{ matrix.type == 'ut' }}
      id: performance
      shell: bash
      env:
        NPU_PHASE: performance
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        finish() {
          rc=$?
          trap - EXIT
          "$python" -B "$helper" lifecycle --policy "$policy" phase --work "$NPU_CI_WORK" --phase "$NPU_PHASE" --stage run-phase --exit "$rc" || rc=1
          exit "$rc"
        }
        trap finish EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        "$python" -B "$NPU_CI_WORK/checkout/test/ci_system/npu/pipeline.py" run --work "$NPU_CI_WORK" --mode "$NPU_PHASE"
    - name: Prepare model runtime
      id: runtime
      if: ${{ matrix.type == 'model_smoke' }}
      shell: bash
      env:
        NPU_PHASE: runtime
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        finish() {
          rc=$?
          trap - EXIT
          "$python" -B "$helper" lifecycle --policy "$policy" phase --work "$NPU_CI_WORK" --phase "$NPU_PHASE" --stage prepare-model-runtime --exit "$rc" || rc=1
          exit "$rc"
        }
        trap finish EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        "$python" -B "$NPU_CI_WORK/checkout/test/ci_system/npu/pipeline.py" model-runtime --policy "$policy" --work "$NPU_CI_WORK"
    - name: Run Qwen model smoke
      id: model
      if: ${{ matrix.type == 'model_smoke' }}
      shell: bash
      env:
        NPU_PHASE: model
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        finish() {
          rc=$?
          trap - EXIT
          "$python" -B "$helper" lifecycle --policy "$policy" phase --work "$NPU_CI_WORK" --phase "$NPU_PHASE" --stage run-model --exit "$rc" || rc=1
          exit "$rc"
        }
        trap finish EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        "$python" -B "$NPU_CI_WORK/checkout/test/ci_system/npu/pipeline.py" model --work "$NPU_CI_WORK"
    - name: Prepare evidence
      id: collect
      if: ${{ always() && env.NPU_CI_WORK != '' }}
      shell: bash
      env:
        NPU_ACCURACY: ${{ steps.accuracy.outcome }}
        NPU_PERFORMANCE: ${{ steps.performance.outcome }}
        NPU_RUNTIME: ${{ steps.runtime.outcome }}
        NPU_MODEL: ${{ steps.model.outcome }}
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        outcomes=$("$python" -c 'import json,os; phases=("accuracy","performance") if os.environ["NPU_TASK_TYPE"]=="ut" else ("runtime","model"); print(json.dumps({p:os.environ["NPU_"+p.upper()] for p in phases}))')
        "$python" -B "$helper" lifecycle --policy "$policy" collect --work "$NPU_CI_WORK" --outcomes "$outcomes"
    - name: Upload evidence (attempt 1)
      id: upload1
      if: ${{ always() && steps.collect.outcome == 'success' && fromJSON(steps.collect.outputs.upload_attempts) >= 1 }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: npu-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}-upload-1
        path: ${{ steps.collect.outputs.path }}
        retention-days: ${{ fromJSON(steps.collect.outputs.retention_days) }}
        if-no-files-found: error
        include-hidden-files: false
    - name: Upload evidence (attempt 2)
      id: upload2
      if: ${{ always() && steps.collect.outcome == 'success' && steps.upload1.outcome != 'success' && fromJSON(steps.collect.outputs.upload_attempts)
        >= 2 }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: npu-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}-upload-2
        path: ${{ steps.collect.outputs.path }}
        retention-days: ${{ fromJSON(steps.collect.outputs.retention_days) }}
        if-no-files-found: error
        include-hidden-files: false
    - name: Upload evidence (attempt 3)
      id: upload3
      if: ${{ always() && steps.collect.outcome == 'success' && steps.upload1.outcome != 'success' && steps.upload2.outcome
        != 'success' && fromJSON(steps.collect.outputs.upload_attempts) >= 3 }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: npu-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}-upload-3
        path: ${{ steps.collect.outputs.path }}
        retention-days: ${{ fromJSON(steps.collect.outputs.retention_days) }}
        if-no-files-found: error
        include-hidden-files: false
    - name: Confirm archive and clean task
      if: ${{ always() && steps.collect.outcome == 'success' }}
      shell: bash
      env:
        NPU_ACCURACY: ${{ steps.accuracy.outcome }}
        NPU_PERFORMANCE: ${{ steps.performance.outcome }}
        NPU_RUNTIME: ${{ steps.runtime.outcome }}
        NPU_MODEL: ${{ steps.model.outcome }}
        NPU_UPLOAD_OUTCOME: ${{ (steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success' || steps.upload3.outcome
          == 'success') && 'success' || 'failure' }}
        NPU_ARTIFACT_ID: ${{ (steps.upload1.outcome == 'success' && steps.upload1.outputs.artifact-id) || (steps.upload2.outcome
          == 'success' && steps.upload2.outputs.artifact-id) || (steps.upload3.outcome == 'success' && steps.upload3.outputs.artifact-id)
          || '' }}
        NPU_ARTIFACT_DIGEST: ${{ (steps.upload1.outcome == 'success' && steps.upload1.outputs.artifact-digest) || (steps.upload2.outcome
          == 'success' && steps.upload2.outputs.artifact-digest) || (steps.upload3.outcome == 'success' && steps.upload3.outputs.artifact-digest)
          || '' }}
      run: |
        set -Eeuo pipefail
        python=/srv/tokenspeed-npu/cann9-torch29-py312-root/venv/bin/python
        helper="$NPU_CI_RUNTIME/pipeline.py"
        policy="$NPU_CI_RUNTIME/policy.json"
        outcomes=$("$python" -c 'import json,os; phases=("accuracy","performance") if os.environ["NPU_TASK_TYPE"]=="ut" else ("runtime","model"); print(json.dumps({p:os.environ["NPU_"+p.upper()] for p in phases}))')
        "$python" -B "$helper" lifecycle --policy "$policy" ack --work "$NPU_CI_WORK" --outcome "$NPU_UPLOAD_OUTCOME" --artifact-id "$NPU_ARTIFACT_ID" --artifact-digest "$NPU_ARTIFACT_DIGEST" --outcomes "$outcomes"
