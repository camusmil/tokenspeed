api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-npu
type: ut
workflow_stage: unit-test
triggers:
- per-commit
- manual
runner:
  labels:
  - ascend-npu-ops-test
env:
  CI: 'true'
report:
  github_step_summary: true
npu:
  schema_version: 1
  watch_paths:
  - tokenspeed-kernel-npu/**
  - tokenspeed-kernel/python/**
  - python/pyproject.toml
  - test/ci/ut/npu-operators.yaml
  - .github/workflows/pr-test-ascendnpu-arm.yml
  - test/ci_system/*ascend*
  - test/ci_system/npu/**
  - tokenspeed-kernel/test/npu/ops/**
  - .github/workflows/run-ci-task-matrix.yml
  - test/ci_system/pipeline.py
  - test/ci_system/ci_path_filter.py
  execution:
    phases:
    - accuracy
    - performance
    fail_fast: true
  performance_policy:
    verdict: not_evaluated
  operators:
  - name: scatter
    script: tokenspeed-kernel/test/npu/ops/test_scatter.py
  - name: virtual_slots_to_local
    script: tokenspeed-kernel/test/npu/ops/test_virtual_slots_to_local.py
  resources:
    architecture: aarch64
    device_ids:
    - 0
    exclusive_host: true
  timeouts:
    lock_wait_seconds: 600
    phase_execution_seconds: 1800
    job_minutes: 90
  cleanup:
    delete_unarchived: false
    pending_warning_seconds: 86400
  kind: operator
  archive:
    artifact_retention_days: 7
    artifact_max_bytes: 1073741824
    upload_attempts: 3
ut:
  commands:
  - python3 -B test/ci_system/npu/lifecycle.py run --work "$NPU_CI_WORK" --mode "$NPU_PHASE"
